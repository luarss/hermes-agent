# Autonomy Profile Evaluation -- Default Configuration
#
# Runs the agent across an O*NET-derived taxonomy of work domains and
# complexity levels, then reports the autonomy frontier per domain
# (max{k | SR(k) >= H}). See ./README.md for details.
#
# Usage:
#   python environments/benchmarks/autonomy_profile/autonomy_profile_env.py evaluate \
#       --config environments/benchmarks/autonomy_profile/default.yaml
#
#   # Override model:
#   python environments/benchmarks/autonomy_profile/autonomy_profile_env.py evaluate \
#       --config environments/benchmarks/autonomy_profile/default.yaml \
#       --openai.model_name anthropic/claude-sonnet-4.6
#
#   # Smoke run on a single domain at low complexity:
#   python environments/benchmarks/autonomy_profile/autonomy_profile_env.py evaluate \
#       --config environments/benchmarks/autonomy_profile/default.yaml \
#       --env.task_files '["tasks/computer.jsonl"]' \
#       --env.complexity_range '[1,3]' \
#       --env.max_concurrent_tasks 2

env:
  enabled_toolsets: ["terminal", "file"]
  max_agent_turns: 40
  max_token_length: 32000
  agent_temperature: 0.2
  terminal_backend: "modal"
  terminal_timeout: 180
  tool_pool_size: 128

  task_files:
    - "tasks/computer.jsonl"
    - "tasks/office_admin.jsonl"
    - "tasks/business_financial.jsonl"
    - "tasks/management.jsonl"
    - "tasks/data_analysis.jsonl"
  taxonomy_dir: "taxonomy"
  domain_filter: null            # optional list to subset, e.g. ["Computer & Mathematical"]
  complexity_range: [1, 7]       # inclusive
  success_threshold: 0.8         # H in max{k | SR(k) >= H}
  task_repetitions: 1            # >1 tightens SR confidence intervals
  task_timeout: 900              # per-task wall-clock budget
  max_concurrent_tasks: 8

  tokenizer_name: "NousResearch/Hermes-3-Llama-3.1-8B"
  use_wandb: true
  wandb_name: "autonomy-profile"
  ensure_scores_are_not_same: false
  data_dir_to_save_evals: "environments/benchmarks/evals/autonomy-profile"

openai:
  base_url: "https://openrouter.ai/api/v1"
  model_name: "anthropic/claude-opus-4.6"
  server_type: "openai"
  health_check: false
  # api_key loaded from OPENROUTER_API_KEY in .env
